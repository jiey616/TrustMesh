name: CI

# 门禁范围：
#   - backend：gofmt 校验 + 编译 + 全量单测 + store 包 -race（护栏 *Unsafe「持锁内调用」契约）
#   - frontend：frontend-v2（单轨）vitest 单测（多租户隔离基线）+ ESLint 门禁（errors 已清零）
#   - smoke：仅在手动触发时跑，需要 docker compose 起 mongo/backend/clawsynapse
#
# 设计取舍：
#   - 不加 `go vet ./...`：存量代码有历史告警，会淹没本次门禁信号（另行单独立项）。
#   - 行尾由仓库根 .gitattributes 统一为 LF（`*.go text eol=lf`），CI 不额外做 CRLF 检查。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + test + race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify module is tidy
        run: go mod verify

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt（请执行 gofmt -w）："
            echo "$unformatted"
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests (store lock contract)
        # *Unsafe 后缀函数只能在持锁内调用；-race 是这条契约的运行时护栏。
        run: go test -race ./internal/store/... -count=1

  frontend:
    name: frontend-v2 (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint 门禁（2026-09-14 接通）：存量 34 errors 已清零（TaskWorkspace 早返回下移到
      # Hook 之后、set-state-in-effect 改渲染期 reset / 延后 tick、useTheme 拆文件修
      # react-refresh、ThemeProvider purity），故 eslint . 现为 0 error / 4 warning。
      # 产物目录已由 eslint.config.js 的 globalIgnores 排除，全量 lint 约 20s
      # （未排除产物目录时会扫打包 bundle，实测 3m39s 且报上千条假错误）。
      # warning 不阻塞（eslint 仅在有 error 时才非 0 退出），但用 --max-warnings
      # 锁住当前值，防止 warning 继续漂移增长。
      - name: Lint (errors are a gate)
        run: npm run lint -- --max-warnings=4

      - name: Unit tests (tenant isolation baseline)
        run: npx vitest run

  smoke:
    name: smoke (manual, docker compose)
    # 需要活体 mongo/backend/clawsynapse，默认不在 PR 上跑，避免 flaky 阻塞合并。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring up stack
        run: docker compose up -d --build mongo backend clawsynapse

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready in time"; docker compose logs backend; exit 1

      - name: Task flow smoke
        run: bash backend/scripts/smoke-task-flow.sh

      - name: Progress/fail flow smoke
        run: bash backend/scripts/smoke-progress-fail-flow.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
