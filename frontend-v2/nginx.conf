server {
    listen 80;
    server_name _;

    # 🔴 桌面端安装包上传（84MB）必须放行：nginx 默认 client_max_body_size 只有 1MB，
    # 而本容器与主网关（nginx-https.conf，同为 512m）是**两条独立入口**——
    # 直连本容器端口（:5174）访问管理页时，/api/ 走的是这里的 server 块，
    # 少了这一行就会在上传 84MB 安装包时返回 413（2026-09-18 线上实测踩中）。
    # 与后端 handler 的 desktopReleaseMaxUpload（512<<20）保持同值。
    client_max_body_size 512m;

    # Docker internal DNS — force re-resolution to survive container IP changes
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend "backend:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /healthz {
        set $backend "backend:8080";
        proxy_pass http://$backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 带 hash 的静态资源可长期缓存（内容变则文件名变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 与 SPA 路由：禁止缓存，确保每次都拉取最新 bundle（避免旧 JS 导致实时刷新失效）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
